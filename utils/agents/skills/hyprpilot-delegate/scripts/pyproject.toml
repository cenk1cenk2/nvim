[project]
name = "hyprpilot-harness-scripts"
version = "1.0.0"
description = "Shell-side plumbing for hyprpilot sessions: wait, resolve, judge, collect, tear down."
requires-python = ">=3.11"
# Intentionally empty. These run as a watcher payload in a background shell and
# on hosts that are not this workstation, so the runtime has to be whatever
# python3 is already there. Test-only tooling lives in dependency-groups below.
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.uv]
python-preference = "only-system"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The CLI contract is exit codes and one-line messages, so most cases shell out
# to the real entry point rather than importing it. `-q` keeps that readable.
addopts = "-q"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
