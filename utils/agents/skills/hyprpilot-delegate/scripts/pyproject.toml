[project]
name = "hyprpilot-harness-scripts"
version = "1.0.0"
description = "Shell-side plumbing for hyprpilot sessions: wait, resolve, judge, collect, tear down."
requires-python = ">=3.11"
dependencies = [
  "agentlib",
  "click>=8.1",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.uv]
python-preference = "only-system"

[tool.uv.sources]
agentlib = { path = "../../lib", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
# Verbosity comes from the Taskfile, which passes -v.
addopts = ""

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
