[project]
name = "grafana-kilic-dashboards-scripts"
version = "1.0.0"
description = "Lint, reflow, retitle and extract queries from Grafana dashboard JSON."
requires-python = ">=3.11"
dependencies = [
  "agentlib",
  "click>=8.1",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.uv]
python-preference = "only-system"

[tool.uv.sources]
agentlib = { path = "../../lib", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ""

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
