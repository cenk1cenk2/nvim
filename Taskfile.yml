---
# https://taskfile.dev

version: "3"

vars:
  # Every agent-skill scripts project, each its own uv project with a pyproject
  # and a test suite. Adding a second skill's scripts is one entry here.
  PYTHON_PROJECTS: >-
    utils/agents/skills/hyprpilot-delegate/scripts
    utils/agents/skills/agent-background/scripts
    utils/agents/skills/config-skills/scripts
    utils/agents/skills/project-facts/scripts
  # Everything ruff should see. The shared `lib` is a library rather than a
  # project with its own suite, so it is linted but not tested.
  PYTHON_PATHS: >-
    utils/agents/skills/hyprpilot-delegate/scripts
    utils/agents/skills/agent-background/scripts
    utils/agents/skills/config-skills/scripts
    utils/agents/skills/project-facts/scripts
    utils/agents/skills/lib

env: {}

tasks:
  format:
    desc: Format the repository.
    deps:
      - format:lua
      - format:sh
      - format:python

  format:lua:
    cmds:
      - stylua --config-path .stylua.toml . -v
    sources:
      - "lua/**/*.lua"

  format:sh:
    cmds:
      - shfmt -f .
    sources:
      - "utils/**/*.sh"

  format:python:
    cmds:
      - for: { var: PYTHON_PATHS }
        cmd: ruff format {{.ITEM}}
    sources:
      - "utils/agents/skills/*/scripts/**/*.py"

  lint:
    desc: Lints the repository.
    deps:
      - lint:lua
      - lint:python

  lint:lua:
    cmds:
      - stylua --config-path .stylua.toml --check .
      - selene .
    sources:
      - "lua/**/*.lua"

  lint:sh:
    cmds:
      - shfmt -f . | xargs shellcheck

  lint:python:
    cmds:
      - for: { var: PYTHON_PATHS }
        cmd: ruff check {{.ITEM}}
      - for: { var: PYTHON_PATHS }
        cmd: ruff format --check {{.ITEM}}
    sources:
      - "utils/agents/skills/*/scripts/**/*.py"

  test:
    desc: Run the repository's test suites.
    deps:
      - test:python

  test:python:
    desc: Agent skill scripts. Each project pulls its own dev group through uv.
    cmds:
      - for: { var: PYTHON_PROJECTS }
        cmd: uv run --project {{.ITEM}} --group dev pytest -v {{.ITEM}}
    sources:
      - "utils/agents/skills/*/scripts/**/*.py"
